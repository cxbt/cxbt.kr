name: Deploy (cxbt.kr)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: deploy-cxbt-kr
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init submodules
        run: |
          set -euo pipefail
          # This repo uses SSH-style submodule URLs; rewrite to HTTPS for Actions.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build
        run: |
          set -euo pipefail
          hugo --minify

      - name: Deploy (rsync over SSH)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/usr/share/caddy/public' }}
          DEPLOY_RSYNC_PATH: ${{ secrets.DEPLOY_RSYNC_PATH || 'rsync' }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -n "${DEPLOY_SSH_KEY_B64:-}" ]; then
            # More robust for GitHub Secrets: avoids newline/CRLF issues.
            printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          elif [ -n "${DEPLOY_SSH_KEY:-}" ]; then
            # Support both raw multiline keys and keys pasted as a single line with literal \n.
            python3 -c 'import os,sys; key=os.environ.get("DEPLOY_SSH_KEY",""); key=(key.replace("\\\\n","\\n") if ("\\\\n" in key and "\\n" not in key) else key); key=key.replace("\\r",""); sys.stdout.write(key)' > ~/.ssh/id_ed25519
          else
            echo "Missing deploy key: set DEPLOY_SSH_KEY_B64 (recommended) or DEPLOY_SSH_KEY" >&2
            exit 1
          fi
          chmod 600 ~/.ssh/id_ed25519

          # Fail fast with a clear error if the key is malformed/encrypted.
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          rsync -az --delete \
            --rsync-path="$DEPLOY_RSYNC_PATH" \
            -e "ssh -p $DEPLOY_PORT -i ~/.ssh/id_ed25519" \
            public/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
